override:
  target:
    entity:
      integration: light_layers
      domain: light
  fields:
    key:
      example: door_night
      default: default
      selector:
        text:
    minutes:
      example: 5
      selector:
        number:
          min: 0.1
          max: 1440
          step: 0.5
          unit_of_measurement: min
          mode: box
    priority:
      default: 0
      selector:
        number:
          min: -100
          max: 100
          mode: box
    off:
      default: false
      selector:
        boolean:
    brightness_pct:
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    brightness:
      selector:
        number:
          min: 0
          max: 255
    color_temp_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    rgb_color:
      selector:
        color_rgb:
    effect:
      selector:
        text:
cancel:
  target:
    entity:
      integration: light_layers
      domain: light
  fields:
    key:
      example: door_night
      selector:
        text:
